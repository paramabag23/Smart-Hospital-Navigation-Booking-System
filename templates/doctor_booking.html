<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLine+ - Book Doctor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <a href="{{ url_for('dashboard') }}" class="back-btn">← Back</a>
            <h1>👨‍⚕️ Book Doctor Appointment</h1>
        </header>
        
        <div class="booking-container">
            <form method="POST" class="booking-form">
                <div class="form-group">
                    <label for="department">Select Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select Department</option>
                        {% for dept in doctors.keys() %}
                        <option value="{{ dept }}">{{ dept }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="doctor">Select Doctor</label>
                    <select id="doctor" name="doctor" required>
                        <option value="">Select Doctor</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                
                <div class="form-group">
                    <label for="time">Time Slot</label>
                    <select id="time" name="time" required>
                        <option value="">Select Time</option>
                        {% for slot in time_slots %}
                        <option value="{{ slot }}">{{ slot }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit" class="btn btn-success">Book Appointment</button>
            </form>
            
            <div class="booking-info">
                <h3>💡 Booking Information</h3>
                <ul>
                    <li>Consultation fee: ₹500</li>
                    <li>Payment can be made after booking</li>
                    <li>Cancel at least 2 hours before appointment</li>
                    <li>Please arrive 15 minutes early</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('department').addEventListener('change', function() {
            const dept = this.value;
            const doctorSelect = document.getElementById('doctor');
            
            if (dept) {
                fetch(`/get-doctors/${dept}`)
                    .then(response => response.json())
                    .then(doctors => {
                        doctorSelect.innerHTML = '<option value="">Select Doctor</option>';
                        doctors.forEach(doc => {
                            const option = document.createElement('option');
                            option.value = doc;
                            option.textContent = doc;
                            doctorSelect.appendChild(option);
                        });
                    });
            } else {
                doctorSelect.innerHTML = '<option value="">Select Doctor</option>';
            }
        });
        
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
