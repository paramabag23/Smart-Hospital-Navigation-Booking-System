<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLine+ - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <div class="hospital-icon">🏥</div>
                <h1>LifeLine+</h1>
                <p>Smart Hospital Management System</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <!-- Login Form -->
            <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
            </div>
            
            <!-- Signup Form (hidden by default) -->
            <form method="POST" action="{{ url_for('signup') }}" class="auth-form" id="signupForm" style="display: none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label for="signup_name">Full Name</label>
                    <input type="text" id="signup_name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="signup_email">Email Address</label>
                    <input type="email" id="signup_email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signup_phone">Phone Number</label>
                    <input type="tel" id="signup_phone" name="phone" placeholder="Enter phone number" required>
                </div>
                <div class="form-group">
                    <label for="signup_password">Password</label>
                    <input type="password" id="signup_password" name="password" placeholder="Create password" required>
                </div>
                <div class="form-group">
                    <label for="signup_confirm">Confirm Password</label>
                    <input type="password" id="signup_confirm" name="confirm_password" placeholder="Confirm password" required>
                </div>
                <div class="form-group">
                    <label for="user_type">User Type</label>
                    <select id="user_type" name="user_type">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success btn-block">Register</button>
                <p style="margin-top: 10px; text-align: center;">
                    <a href="#" onclick="showLogin()">Back to Login</a>
                </p>
            </form>
        </div>
    </div>
    
    <script>
        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.querySelector('.auth-footer').style.display = 'none';
        }
        
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            document.querySelector('.auth-footer').style.display = 'block';
        }
    </script>
</body>
</html>
