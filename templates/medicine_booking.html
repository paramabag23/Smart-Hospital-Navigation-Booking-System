<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLine+ - Order Medicine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <a href="{{ url_for('dashboard') }}" class="back-btn">← Back</a>
            <h1>💊 Order Medicine</h1>
        </header>
        
        <div class="booking-container">
            <form method="POST" class="booking-form">
                <div class="form-group">
                    <label for="medicine">Select Medicine</label>
                    <select id="medicine" name="medicine" required>
                        <option value="">Select Medicine</option>
                        {% for med, details in medicines.items() %}
                        <option value="{{ med }}" data-price="{{ details.price }}">
                            {{ med }} - ₹{{ details.price }} ({{ details.category }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group half">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" name="quantity" value="1" min="1" max="10" required>
                    </div>
                    <div class="form-group half">
                        <label for="total">Total Amount</label>
                        <input type="text" id="total" value="₹25" readonly>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="date">Delivery Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                
                <div class="form-group">
                    <label for="notes">Special Instructions</label>
                    <textarea id="notes" name="notes" placeholder="Any special instructions"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">Place Order</button>
            </form>
            
            <div class="booking-info">
                <h3>💊 Medicine Information</h3>
                <ul>
                    <li><strong>Delivery:</strong> Free for orders above ₹200</li>
                    <li><strong>Processing Time:</strong> 2-4 hours</li>
                    <li><strong>Prescription:</strong> Required for prescription drugs</li>
                    <li><strong>Return Policy:</strong> 7 days return policy</li>
                </ul>
                <div class="prescription-note">
                    <p>📋 For prescription medicines, please upload your prescription during checkout.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const medicineSelect = document.getElementById('medicine');
        const quantityInput = document.getElementById('quantity');
        const totalInput = document.getElementById('total');
        
        function updateTotal() {
            const selected = medicineSelect.options[medicineSelect.selectedIndex];
            const price = selected.dataset.price ? parseInt(selected.dataset.price) : 0;
            const quantity = parseInt(quantityInput.value) || 1;
            totalInput.value = `₹${price * quantity}`;
        }
        
        medicineSelect.addEventListener('change', updateTotal);
        quantityInput.addEventListener('input', updateTotal);
        
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
